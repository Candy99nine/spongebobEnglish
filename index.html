	<style>
	*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
	html,body{height:100%}
	body{font-family:'Comic Sans MS','Chalkboard SE','Segoe UI','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;background:#032235;overflow:hidden;user-select:none;-webkit-user-select:none}
	button{font-family:inherit}
	/* ===== 舞台与海底背景 ===== */
	.stage{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#07456e 0%,#0a6f92 40%,#0f97a6 72%,#16b8ad 100%)}
	.stage::before{content:'';position:absolute;left:50%;top:-140px;transform:translateX(-50%);width:900px;height:420px;background:radial-gradient(ellipse at center,rgba(180,240,255,.25),transparent 65%);pointer-events:none}
	.deco{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
	#screen{position:relative;flex:1;z-index:2;overflow:hidden}
	.sand{position:absolute;left:0;right:0;bottom:0;height:74px;background:linear-gradient(#efdca4,#dcc387);border-radius:46px 70px 0 0/34px 54px 0 0;box-shadow:inset 0 8px 0 rgba(255,255,255,.25)}
	.sand::after{content:'';position:absolute;inset:12px 40px 8px;background:radial-gradient(circle at 12% 40%,rgba(160,120,50,.28) 3px,transparent 4px),radial-gradient(circle at 46% 62%,rgba(160,120,50,.28) 4px,transparent 5px),radial-gradient(circle at 82% 35%,rgba(160,120,50,.28) 3px,transparent 4px)}
	.weed{position:absolute;bottom:60px;width:24px;background:linear-gradient(#2aa06a,#0f7a4d);border-radius:12px 12px 4px 4px;transform-origin:bottom center;animation:sway 3.2s ease-in-out infinite alternate;opacity:.9}
	.bub{position:absolute;bottom:-70px;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.85),rgba(255,255,255,.12) 62%,rgba(255,255,255,0));border:1px solid rgba(255,255,255,.35);animation:rise linear infinite}
	.pine{position:absolute;left:26px;bottom:52px;width:120px;height:200px}
	.pine .pbody{position:absolute;bottom:0;left:0;width:118px;height:142px;background-color:#ffa53d;background-image:repeating-linear-gradient(58deg,rgba(150,66,0,.38) 0 3px,transparent 3px 15px),repeating-linear-gradient(-58deg,rgba(150,66,0,.38) 0 3px,transparent 3px 15px);border:3px solid #d67f1e;border-radius:58px 58px 52px 52px/72px 72px 48px 48px}
	.pine .leaf{position:absolute;bottom:136px;left:46px;width:26px;height:56px;background:linear-gradient(#43b364,#1e7a3c);border-radius:50% 50% 30% 30%/72% 72% 24% 24%;transform-origin:bottom center}
	.pine .leaf.f1{transform:rotate(-30deg);left:22px}
	.pine .leaf.f2{left:46px;height:66px}
	.pine .leaf.f3{transform:rotate(30deg);left:70px}
	.pine .pdoor{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:38px;height:54px;background:#2f6fb3;border:3px solid #1c4d84;border-radius:19px 19px 5px 5px}
	.pine .pdoor::after{content:'';position:absolute;right:6px;top:24px;width:7px;height:7px;background:#ffd633;border-radius:50%}
	.jelly{position:absolute;width:64px;height:66px;animation:jfloat 3.4s ease-in-out infinite alternate}
	.jelly .jd{width:64px;height:40px;background:radial-gradient(circle at 50% 30%,#ffd3e8,#ff8ac6 72%);border-radius:32px 32px 14px 14px;position:relative;box-shadow:inset -4px -4px 8px rgba(200,60,130,.35)}
	.jelly .jd::before{content:'';position:absolute;inset:6px 10px;background:radial-gradient(circle at 12px 10px,#ffe6f2 4px,transparent 5px),radial-gradient(circle at 40px 18px,#ffe6f2 5px,transparent 6px);opacity:.85}
	.jelly .jt{position:absolute;top:38px;left:8px;display:flex;gap:7px}
	.jelly .jt i{display:block;width:5px;height:22px;background:linear-gradient(#ff8ac6,#ff6fb5);border-radius:3px;transform-origin:top;animation:jsway 1.5s ease-in-out infinite alternate}
	.jelly .jt i:nth-child(2){animation-delay:.2s;height:26px}
	.jelly .jt i:nth-child(3){animation-delay:.35s}
	.jelly .jt i:nth-child(4){animation-delay:.5s;height:18px}
	/* ===== 顶部 HUD ===== */
	.hud{position:relative;z-index:10;height:78px;flex:none;display:flex;align-items:center;gap:16px;padding:0 18px;background:rgba(4,38,62,.55);border-bottom:3px solid rgba(255,255,255,.18)}
	.hud-l{display:flex;gap:10px}
	.ibtn{width:54px;height:54px;border:none;border-radius:16px;background:rgba(255,255,255,.92);font-size:26px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
	.ibtn:active{transform:translateY(2px)}
	.hud-c{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
	.lvltag{font-size:18px;font-weight:bold;color:#ffe066;text-align:center;line-height:1}
	.progress{height:18px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);border-radius:10px;overflow:hidden}
	.pfill{height:100%;width:0;background:linear-gradient(90deg,#ffd633,#ffe98a);border-radius:10px;transition:width .5s}
	.qinfo{font-size:16px;color:#cfeef7;text-align:center;line-height:1}
	.hud-r{display:flex;align-items:center;gap:14px}
	.items{display:flex;gap:6px;font-size:26px}
	.items span{filter:grayscale(1);opacity:.35;transition:.3s}
	.items span.got{filter:none;opacity:1}
	.score{font-size:26px;font-weight:bold;color:#ffe066;min-width:96px;text-align:center}
	.timer{width:60px;height:60px;flex:none;border-radius:50%;background:#fff;border:4px solid #ffd633;color:#084b6e;font-size:28px;font-weight:bold;display:flex;align-items:center;justify-content:center}
	.timer.warn{border-color:#ff6b6b;color:#d33;animation:warn .9s infinite}
	/* ===== 通用按钮 ===== */
	.btn{border:none;border-radius:24px;font-weight:bold;cursor:pointer;color:#083b56;transition:transform .1s}
	.btn:active{transform:translateY(3px)}
	.btn-yellow{background:linear-gradient(#ffe572,#ffc918);box-shadow:0 7px 0 #c99a00,0 12px 18px rgba(0,0,0,.22)}
	.btn-green{background:linear-gradient(#66e394,#2fbf63);color:#03331b;box-shadow:0 7px 0 #1d8f47,0 12px 18px rgba(0,0,0,.22)}
	.btn-blue{background:linear-gradient(#7fd4ff,#39a9e0);color:#033150;box-shadow:0 7px 0 #2377a8,0 12px 18px rgba(0,0,0,.22)}
	.btn-big{font-size:clamp(24px,2.6vw,40px);padding:14px 46px}
	.linklike{background:none;border:none;color:#4b7c96;font-size:20px;text-decoration:underline;cursor:pointer;margin-top:14px}
	/* ===== 主菜单 / 关卡选择 ===== */
	.start{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
	.start-title{font-size:clamp(44px,6.4vw,88px);font-weight:bold;color:#ffd633;text-shadow:0 6px 0 #b8741a,0 12px 26px rgba(0,20,40,.5);transform:rotate(-2deg)}
	.start-sub{font-size:clamp(20px,2.4vw,32px);color:#eafcff;text-shadow:0 2px 6px rgba(0,30,50,.5)}
	.btn-play{font-size:clamp(34px,4vw,58px);padding:20px 90px;border-radius:60px;margin-top:14px}
	.start-hint{color:#bfeaf2;font-size:18px}
	.start .sidebob{position:absolute;right:5%;bottom:88px}
	.start .patbob{position:absolute;left:15%;bottom:104px}
	.select{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
	.sec-title{font-size:clamp(34px,4vw,54px);font-weight:bold;color:#ffd633;text-shadow:0 4px 0 #b8741a}
	.lvrow{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
	.lvcard{width:260px;background:linear-gradient(#ffffff,#eaf7ff);border:5px solid #ffd633;border-radius:26px;padding:20px;text-align:center;cursor:pointer;box-shadow:0 10px 0 #caa32b,0 16px 30px rgba(0,0,0,.25);transition:transform .15s}
	.lvcard:hover{transform:translateY(-8px) rotate(-1deg)}
	.lvcard .ico{font-size:64px}
	.lvcard h3{font-size:26px;color:#08536e;margin:8px 0}
	.lvcard p{font-size:18px;color:#4b7c96;min-height:44px}
	.lvcard .stars{font-size:26px;color:#ffb02e;letter-spacing:5px;margin-top:6px}
	/* ===== 游戏区布局 ===== */
	.gwrap{position:relative;display:flex;width:100%;height:100%;align-items:center;justify-content:center;gap:14px;padding:8px 24px 96px}
	.main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px}
	.prompt{font-size:clamp(22px,2.3vw,34px);font-weight:bold;color:#fff;text-shadow:0 2px 6px rgba(0,30,50,.45);text-align:center}
	.side{flex:none;width:250px;display:flex;flex-direction:column;align-items:center;gap:8px}
	.bubble{position:relative;background:#fff;color:#095a78;font-weight:bold;font-size:clamp(18px,1.8vw,25px);padding:12px 18px;border-radius:16px;max-width:240px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.2)}
	.bubble::after{content:'';position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:10px solid transparent;border-top-color:#fff;border-bottom:0}
	.bubble.popb{animation:bpop .35s}
	.tip{font-size:16px;color:#cfeef7;text-align:center}
	.btnrow{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
	/* ===== 单词卡片与格子 ===== */
	.slotrow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:center}
	.slot{min-width:110px;min-height:90px;border:4px dashed rgba(255,255,255,.8);border-radius:18px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;padding:4px}
	.slot.good{border-style:solid;border-color:#5fe08d;background:rgba(95,224,141,.15)}
	.punct{font-size:clamp(30px,3.8vw,54px);font-weight:bold;color:#fff;padding:0 4px 12px}
	.pool{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;min-height:130px;padding:8px}
	.word{display:inline-flex;align-items:center;justify-content:center;padding:12px 26px;background:#fff;border:3px solid #cfe8f3;border-radius:18px;font-size:clamp(32px,3.8vw,56px);font-weight:bold;color:#094b66;cursor:grab;touch-action:none;box-shadow:0 6px 0 rgba(9,60,90,.16),0 10px 18px rgba(0,0,0,.18);transition:transform .12s}
	.word:hover{transform:translateY(-4px)}
	.word.dragging{cursor:grabbing;transform:scale(1.07);box-shadow:0 16px 26px rgba(0,0,0,.3);transition:none}
	.word.err{animation:errf .9s}
	.word.glow{animation:glowa 1.7s}
	.word.good{background:#e9fbf0;border-color:#3ecf77;color:#0a7a44}
	/* ===== 选项 / 词块 ===== */
	.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
	.chip{display:inline-flex;padding:10px 24px;background:#fff;border-radius:16px;font-size:clamp(26px,3.2vw,46px);font-weight:bold;color:#094b66;box-shadow:0 4px 0 rgba(9,60,90,.18)}
	.chip.punct-chip{background:rgba(255,255,255,.35);color:#fff;box-shadow:none}
	.optcol{display:flex;flex-direction:column;gap:14px;width:min(760px,94%)}
	.optcol.center{align-items:center}
	.opt{font-size:clamp(28px,3.8vw,50px);font-weight:bold;color:#08405e;background:#fff;border:4px solid #ffd633;border-radius:20px;padding:14px 30px;cursor:pointer;box-shadow:0 7px 0 #caa32b,0 12px 20px rgba(0,0,0,.2);transition:transform .1s;width:100%;text-align:center}
	.opt:hover{transform:translateY(-3px)}
	.opt.bad{background:#ffecec;border-color:#e2564f;box-shadow:0 7px 0 #b03a34;opacity:.7;pointer-events:none}
	.opt.dead{opacity:.3;pointer-events:none;filter:grayscale(.8)}
	.opt.good{background:#e9fbf0;border-color:#3ecf77;box-shadow:0 7px 0 #23a355;color:#0a7a44;pointer-events:none}
	/* ===== 第三关 完形填空 ===== */
	.sentrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
	.bubbleb{display:inline-flex;align-items:center;justify-content:center;min-width:100px;padding:10px 26px;background:#eafaff;border:3px solid #7fd4ff;border-radius:26px;font-size:clamp(26px,3.2vw,46px);font-weight:bold;color:#0a7a9e;position:relative;animation:bfloat 2.6s ease-in-out infinite alternate}
	.bubbleb::after{content:'';position:absolute;right:-9px;top:-9px;width:14px;height:14px;background:rgba(255,255,255,.75);border-radius:50%}
	.bubbleb.good{background:#e9fbf0;border-color:#3ecf77;color:#0a7a44}
	.bubbleb.gone{opacity:0;transform:scale(.2);transition:.5s}
	.optrow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
	.fopt{width:auto;min-width:180px}
	/* ===== 第二关 双人PK ===== */
	.l2pk{flex-direction:column;justify-content:flex-start;padding-top:10px;gap:8px}
	.pk-top{width:100%}
	.pk-mid{display:flex;align-items:flex-start;justify-content:center;gap:10px;width:100%;flex:1}
	.zone{width:min(31vw,430px);display:flex;flex-direction:column;align-items:center;gap:8px}
	.zhead{font-size:clamp(18px,1.8vw,26px);font-weight:bold;color:#fff;text-shadow:0 2px 4px rgba(0,30,50,.5)}
	.zscore{color:#ffe066;font-size:1.25em}
	.zone .opt{font-size:clamp(20px,2vw,30px);padding:10px 14px}
	.pk-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:150px}
	.vs{font-size:clamp(26px,3vw,44px);font-weight:bold;color:#fff;text-shadow:0 3px 0 rgba(0,40,70,.4)}
	.jly{position:relative;width:210px;height:140px;transition:filter .4s}
	.jly .jelly:nth-child(1){left:0;top:26px}
	.jly .jelly:nth-child(2){left:74px;top:0}
	.jly .jelly:nth-child(3){left:140px;top:40px}
	.jly.scatter .jelly{opacity:.15;transition:transform .8s,opacity .8s}
	.jly.scatter .jelly:nth-child(1){transform:translate(-100px,-60px) rotate(-30deg)}
	.jly.scatter .jelly:nth-child(2){transform:translate(20px,-110px) rotate(25deg)}
	.jly.scatter .jelly:nth-child(3){transform:translate(110px,-60px) rotate(30deg)}
	/* ===== 海绵宝宝（纯 CSS 绘制）===== */
	.bob{position:relative;width:176px;height:238px;flex:none}
	.bob .b-body{position:absolute;left:23px;top:8px;width:130px;height:158px;background:linear-gradient(180deg,#ffec74,#ffd633);border:3px solid #c9a02a;border-radius:12px;box-shadow:0 6px 14px rgba(0,20,40,.25)}
	.bob .hole{position:absolute;background:radial-gradient(circle at 35% 30%,#f1cf55,#d8aa26);border-radius:50%;box-shadow:inset 1px 2px 3px rgba(120,80,0,.35)}
	.bob .h1{left:7px;top:14px;width:18px;height:18px}
	.bob .h2{right:7px;top:36px;width:14px;height:14px}
	.bob .h3{left:11px;top:106px;width:15px;height:15px}
	.bob .h4{right:11px;top:118px;width:18px;height:18px}
	.bob .h5{left:44px;top:3px;width:10px;height:10px}
	.bob .h6{right:44px;top:6px;width:9px;height:9px}
	.bob .eyes{position:absolute;left:50%;top:20px;transform:translateX(-50%);display:flex;gap:3px;z-index:4}
	.bob .eye{position:relative;width:48px;height:48px;background:#fff;border:3px solid #3a3a3a;border-radius:50%}
	.bob .iris{position:absolute;left:50%;top:50%;width:23px;height:23px;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 35%,#bfe6fb 25%,#3a8ecb 78%);border-radius:50%}
	.bob .iris::after{content:'';position:absolute;left:50%;top:50%;width:11px;height:11px;transform:translate(-50%,-50%);background:#14202a;border-radius:50%}
	.bob .iris::before{content:'';position:absolute;left:22%;top:16%;width:6px;height:6px;background:#fff;border-radius:50%;z-index:2}
	.bob .lash{position:absolute;top:-10px;width:3px;height:11px;background:#3a3a3a;border-radius:2px;transform-origin:bottom center}
	.bob .lash.l1{left:9px;transform:rotate(-26deg)}
	.bob .lash.l2{left:21px}
	.bob .lash.l3{left:33px;transform:rotate(26deg)}
	.bob .nose{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:13px;height:21px;background:#ffe063;border:2px solid #c9a02a;border-radius:50%/58% 58% 42% 42%;z-index:5}
	.bob .mouth{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:90px;height:44px;border-bottom:6px solid #8c4a1a;border-radius:50%;z-index:3}
	.bob .teeth{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);display:flex}
	.bob .tooth{width:16px;height:17px;background:#fff;border:2px solid #d0d0d0;border-radius:2px 2px 6px 6px}
	.bob .cheek{position:absolute;top:94px;width:9px;height:9px;background:#f2a0a0;border-radius:50%;z-index:3}
	.bob .cheek.cl{left:12px;box-shadow:11px 9px 0 -2px #f2a0a0,3px 16px 0 -3px #f2a0a0}
	.bob .cheek.cr{right:12px;box-shadow:-11px 9px 0 -2px #f2a0a0,-3px 16px 0 -3px #f2a0a0}
	.bob .shirt{position:absolute;left:-3px;right:-3px;bottom:30px;height:18px;background:#fff;border:3px solid #c9a02a;z-index:2}
	.bob .tie{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:3}
	.bob .tie .knot{width:14px;height:11px;background:#d8342c;border-radius:3px}
	.bob .tie .tip{width:0;height:0;margin:0 auto;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid #d8342c}
	.bob .pants{position:absolute;left:-3px;right:-3px;bottom:-3px;height:26px;background:#9c6a33;border:3px solid #c9a02a;border-radius:0 0 10px 10px;z-index:2}
	.bob .pants::before{content:'';position:absolute;left:0;right:0;top:-3px;height:6px;background:#2b2118}
	.bob .arm{position:absolute;top:112px;width:38px;height:9px;background:#ffd633;border:2px solid #c9a02a;border-radius:6px;z-index:1;transition:transform .35s}
	.bob .arm.al{left:-6px;transform:rotate(30deg)}
	.bob .arm.ar{right:-6px;transform:rotate(-30deg)}
	.bob .hand{position:absolute;top:-5px;width:16px;height:16px;background:#ffd633;border:2px solid #c9a02a;border-radius:50%}
	.bob .arm.al .hand{left:-9px}
	.bob .arm.ar .hand{right:-9px}
	.bob .leg{position:absolute;top:164px;width:10px;height:30px;background:#ffd633;border:2px solid #c9a02a}
	.bob .leg.ll{left:56px}
	.bob .leg.lr{right:56px}
	.bob .leg::before{content:'';position:absolute;left:-2px;top:10px;width:12px;height:8px;background:#fff}
	.bob .leg::after{content:'';position:absolute;left:-8px;bottom:-9px;width:24px;height:12px;background:#1d1d1d;border-radius:10px 10px 3px 3px}
	.bob .zs{position:absolute;font-size:30px;opacity:0;z-index:9;pointer-events:none}
	.bob .zs1{left:-14px;top:-16px}
	.bob .zs2{right:-16px;top:26px}
	.bob .zs3{left:6px;bottom:-4px}
	.bob.zap{animation:shake .6s}
	.bob.zap .zs{animation:flick .9s ease}
	.bob.zap .zs2{animation-delay:.12s}
	.bob.zap .zs3{animation-delay:.24s}
	.bob.zap .iris{visibility:hidden}
	.bob.zap .eye::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;color:#333;z-index:2}
	.bob.zap .mouth{border-bottom-color:transparent}
	.bob.zap .mouth::after{content:'';position:absolute;left:50%;top:10px;transform:translateX(-50%);width:18px;height:15px;background:#5b2b12;border-radius:50%}
	.bob.shakeb{animation:shake .55s}
	.bob.cheer .arm.al{transform:rotate(-135deg)}
	.bob.cheer .arm.ar{transform:rotate(135deg)}
	.bob.cheer{animation:jump .65s ease-in-out 2}
	.bob.through{animation:through .95s ease forwards}
	.bob.dance{animation:dance .85s ease-in-out infinite}

const BOOK_LIST=['3上','3下','4上','4下','5上','5下','6上','6下'];
const UNIT_LIST=[1,2,3,4,5,6];
const SCOPE_KEY='sbSentenceScopeV1';
let SCOPE=(()=>{try{const o=JSON.parse(localStorage.getItem(SCOPE_KEY));
  if(o&&Array.isArray(o.books))return{books:new Set(o.books.length?o.books:BOOK_LIST),
    units:(Array.isArray(o.units)&&o.units.length)?new Set(o.units):null};
}catch(e){}return{books:new Set(BOOK_LIST),units:null};})();
function saveScope(){try{localStorage.setItem(SCOPE_KEY,JSON.stringify({books:[...SCOPE.books],units:SCOPE.units?[...SCOPE.units]:[]}));}catch(e){}}
function scopePool(){return CORPUS.filter(r=>SCOPE.books.has(r[2])&&(!SCOPE.units||SCOPE.units.has(r[3])));}
function bookPool(){return CORPUS.filter(r=>SCOPE.books.has(r[2]));}
function scopeLabel(){const bs=SCOPE.books.size===BOOK_LIST.length?'全部8册':[...SCOPE.books].sort().join('、');
  const us=!SCOPE.units?'全部单元':'第'+[...SCOPE.units].sort((x,y)=>x-y).join('、')+'单元';return bs+' · '+us;}
function pickPool(minW,maxW,n){
  let pool;
  if(S.wrongOnly){   /* 只练错题：从错题本抽，不受册/单元范围限制 */
    pool=nbPool();
    if(!pool.length)pool=scopePool();
    if(!pool.length)pool=CORPUS.slice();
    return shuffle(pool).slice(0,n);   /* 错题按句数循环抽，不卡词数 */
  }
  pool=scopePool();if(!pool.length)pool=bookPool();if(!pool.length)pool=CORPUS.slice();
  const mastered=new Set(NB.mastered.map(x=>x.en));
  let fresh=pool.filter(r=>!mastered.has(r[0]));   /* 全会本的句子不再出 */
  if(fresh.length<n)fresh=pool;   /* 剩下太少就放宽，保证出得了题 */
  let good=fresh.filter(r=>{const w=r[0].split(' ').length;return w>=minW&&w<=maxW;});
  if(good.length<n)good=fresh;
  return shuffle(good).slice(0,n);
}
/* 第二关干扰项：主谓互换 / 末词提前 / 词序轮换 */
function makeChoices(sent){
  const base=sent.replace(/[.!?]+$/,''),punct=sent.trim().endsWith('?')?'?':'.';
  const tk=base.split(' '),right=base+punct,opts=[right];
  const variants=[];
  if(tk.length>=2){const a=tk.slice();[a[0],a[1]]=[a[1],a[0]];variants.push(a.join(' ')+punct);}
  if(tk.length>=2){const a=tk.slice();a.unshift(a.pop());variants.push(a.join(' ')+punct);}
  if(tk.length>=3){const a=[tk[1],tk[2],tk[0]].concat(tk.slice(3));variants.push(a.join(' ')+punct);}
  for(const v of variants){if(opts.length>=3)break;if(v!==right&&!opts.includes(v))opts.push(v);}
  let g=0;while(opts.length<3&&g++<40){const v=shuffle(tk).join(' ')+punct;if(!opts.includes(v))opts.push(v);}
  /* 短句(2词)换位凑不出3种：从词库借词替换一个词，造用词不同的干扰项 */
  g=0;
  while(opts.length<3&&g++<80){
    const r=CORPUS[Math.floor(Math.random()*CORPUS.length)];
    const cand=r[0].split(' ').filter(x=>x.length>1&&!/^[A-Z]/.test(x)&&!tk.includes(x));
    if(!cand.length)continue;
    const a=tk.slice();a[Math.floor(Math.random()*a.length)]=cand[Math.floor(Math.random()*cand.length)];
    const v=a.join(' ')+punct;
    if(!opts.includes(v)&&v!==right)opts.push(v);
  }
  while(opts.length<3)opts.push(shuffle(tk).join(' ')+punct+'?');
  return opts;
}

    have:['has','had','having'],has:['have','had','having'],had:['have','has','having'],
    can:['may','will','must'],will:['may','can','shall'],
    a:['an','the',''],an:['a','the',''],the:['a','an','']};
  let out=[];
  if(M[low])out=M[low].slice(0,2).map(x=>x===low?x.toUpperCase():x);
  else{out=[/s$/.test(w)?w.slice(0,-1):w+'s', /s$/.test(w)?w+'s':w+'es'];}
  out=[...new Set(out.filter(x=>x&&x.toLowerCase()!==low))];
  while(out.length<2)out.push(out.length?'very':'not');

function makeFill(rec){
  let s=rec[0].trim(),punct=/[.!?]$/.test(s)?s.slice(-1):'';
  s=s.replace(/[.!?]+$/,'');
  let tk=s.split(' ');if(tk.length<3)tk=['I','like','it.'];
  let idx=1;for(let i=1;i<tk.length;i++){if(tk[i].replace(/[^A-Za-z']/g,'').length>=2){idx=i;break;}}
  let correct=tk[idx];const b=tk.slice(0,idx),a=tk.slice(idx+1);
  if(punct){if(a.length)a[a.length-1]+=punct;else if(b.length)b[b.length-1]+=punct;else correct+=punct;}
  return {b:b,a:a,o:[correct].concat(makeDistract(correct.replace(/[^A-Za-z']/g,''))),c:0};
}

const NB_KEY='sbNotebookV1';
let NB={wrong:[],mastered:[]};
function loadNB(){try{const o=JSON.parse(localStorage.getItem(NB_KEY));if(o){if(Array.isArray(o.wrong))NB.wrong=o.wrong;if(Array.isArray(o.mastered))NB.mastered=o.mastered;}}catch(e){}}
function saveNB(){try{localStorage.setItem(NB_KEY,JSON.stringify(NB));}catch(e){}}
function curMeta(){return META['l'+S.level]&&META['l'+S.level][S.qi];}
function nbRec(){const m=curMeta();if(!m||!m.en)return null;
  const hits=CORPUS.filter(r=>r[0]===m.en);
  return {en:m.en,zh:m.zh||(hits[0]&&hits[0][1])||'',b:hits[0]?hits[0][2]:'',u:hits[0]?hits[0][3]:0};}
function nbAdd(kind){const r=nbRec();if(!r)return false;
  const arr=NB[kind];if(arr.some(x=>x.en===r.en))return false;
  arr.push(r);saveNB();return true;}
function nbRemove(kind,en){NB[kind]=NB[kind].filter(x=>x.en!==en);saveNB();}
/* 当前句加入全会本：同时从错题本移除（太简单=会了，不该再算错题） */
function markTooEasy(){const r=nbRec();if(!r)return;
  if(!NB.mastered.some(x=>x.en===r.en))NB.mastered.push(r);
  NB.wrong=NB.wrong.filter(x=>x.en!==r.en);
  saveNB();
  const b=document.getElementById('too-easy-btn');if(b)b.textContent='✅ 已加入全会本';
  toast('✅ 太简单！这句以后不再出（可在全会本删掉恢复）');}
function markWrong(){const r=nbRec();if(!r)return;
  if(NB.wrong.some(x=>x.en===r.en))return;
  if(NB.mastered.some(x=>x.en===r.en))return;  /* 全会本里的不记错题 */
  NB.wrong.push(r);saveNB();}
function nbPool(){return NB.wrong.map(w=>[w.en,w.zh,w.b,w.u]).filter(r=>r[0]);}

let NEXT_TIMER=null,SPEAK_TOKEN=0,SPEAK_DONE=true;
function clearNextTimer(){if(NEXT_TIMER){clearTimeout(NEXT_TIMER);NEXT_TIMER=null;}}
function speakAnswer(onEnd){
  if(!S.autoRead||!S.sound||!window.speechSynthesis)return false;
  const m=META['l'+S.level]&&META['l'+S.level][S.qi];if(!m||!m.en)return false;
  try{
    const u=new SpeechSynthesisUtterance(m.en);
    u.lang='en-US';u.rate=.82;u.pitch=1.04;
    SPEAK_DONE=false;
    u.onend=()=>{SPEAK_DONE=true;if(onEnd)onEnd();};
    u.onerror=()=>{SPEAK_DONE=true;if(onEnd)onEnd();};
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false;}
}
function answerAssist(){
  showMeaning();

    const b=document.createElement('button');b.className='tooeasy-btn';b.id='too-easy-btn';
    b.style.cssText='position:fixed;left:50%;top:70%;transform:translateX(-50%);z-index:81';
    b.textContent='✅ 太简单了（这句不再出）';b.onclick=markTooEasy;document.body.appendChild(b);
    setTimeout(()=>{if(b.parentNode)b.remove();},6000);

    if(myTok!==SPEAK_TOKEN||myQi!==S.qi)return;  /* 题已换/回调过期，忽略 */
    clearNextTimer();
    NEXT_TIMER=setTimeout(()=>{if(myTok===SPEAK_TOKEN&&myQi===S.qi){NEXT_TIMER=null;nextQ();}},320);
  });

  }

}

	let AC=null;
	function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return null;}return AC;}
	function tone(f,d,type,v,delay,slideTo){
	  const a=ac();if(!a||!S.sound)return;
	  type=type||'sine';v=v||.2;delay=delay||0;
	  const t0=a.currentTime+delay;
	  const o=a.createOscillator(),g=a.createGain();
	  o.type=type;o.frequency.setValueAtTime(f,t0);
	  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+d);
	  g.gain.setValueAtTime(.0001,t0);
	  g.gain.exponentialRampToValueAtTime(v,t0+.02);
	  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
	  o.connect(g);g.connect(a.destination);
	  o.start(t0);o.stop(t0+d+.05);
	}
	function sClick(){tone(700,.07,'square',.06);}

	function sCombo(n){const b=620+n*90;tone(b,.1,'square',.14);tone(b*1.25,.14,'square',.14,.09);}
	function sZap(){ /* 水母电击"滋滋"声 */
	  const a=ac();if(!a||!S.sound)return;
	  const t0=a.currentTime;
	  const o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
	  o.type='sawtooth';o.frequency.setValueAtTime(170,t0);o.frequency.linearRampToValueAtTime(70,t0+.38);
	  l.type='square';l.frequency.value=16;lg.gain.value=55;
	  l.connect(lg);lg.connect(o.frequency);
	  g.gain.setValueAtTime(.18,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.42);
	  o.connect(g);g.connect(a.destination);
	  o.start(t0);o.stop(t0+.45);l.start(t0);l.stop(t0+.45);
	}

	/* 拖动（鼠标/手指通用）+ 点击放置 */
	function makeDraggable(card,wi){
	  let sx=0,sy=0,offX=0,offY=0,moved=false,dragging=false,rect0=null;
	  card.addEventListener('pointerdown',e=>{
	    if(S.lock)return;
	    e.preventDefault();
	    try{card.setPointerCapture(e.pointerId);}catch(err){}
	    sx=e.clientX;sy=e.clientY;moved=false;dragging=true;
	    rect0=card.getBoundingClientRect();
	    offX=e.clientX-rect0.left;offY=e.clientY-rect0.top;
	  });
	  card.addEventListener('pointermove',e=>{
	    if(!dragging)return;
	    if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){
	      moved=true;
	      card.classList.add('dragging');
	      card.style.position='fixed';
	      card.style.left=rect0.left+'px';
	      card.style.top=rect0.top+'px';
	      card.style.width=rect0.width+'px';
	      card.style.margin='0';
	      card.style.zIndex=1000;
	    }
	    if(moved){
	      card.style.left=(e.clientX-offX)+'px';
	      card.style.top=(e.clientY-offY)+'px';
	    }
	  });
	  card.addEventListener('pointerup',e=>{
	    if(!dragging)return;
	    dragging=false;
	    const wasMoved=moved;
	    card.classList.remove('dragging');
	    card.style.cssText='';
	    if(wasMoved){
	      const si=slotAt(e.clientX,e.clientY);
	      if(si>=0)dropWord(wi,si);
	      renderSortGame();
	    }else tapWord(wi);
	  });
	  card.addEventListener('pointercancel',()=>{
	    dragging=false;
	    card.classList.remove('dragging');
	    card.style.cssText='';
	    renderSortGame();
	  });
	}
	function slotAt(x,y){
	  const slots=document.querySelectorAll('#slots .slot');
	  for(let i=0;i<slots.length;i++){
	    const r=slots[i].getBoundingClientRect();
	    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return i;
	  }
	  return -1;
	}
	function dropWord(wi,si){
	  const cur=S.placed.indexOf(wi);
	  if(cur===si)return;
	  if(cur>=0){const tmp=S.placed[si];S.placed[si]=wi;S.placed[cur]=tmp;}
	  else S.placed[si]=wi;
	  sClick();
	}
	function tapWord(wi){
	  const cur=S.placed.indexOf(wi);
	  if(cur>=0){S.placed[cur]=null;sClick();}
	  else{
	    const si=S.placed.indexOf(null);
	    if(si<0){toast(t('fullSlots'));return;}
	    S.placed[si]=wi;sClick();
	  }
	  renderSortGame();
	}
	function hintFirst(){
	  const w=S.qAnswer[0];
	  const el=[...document.querySelectorAll('#pool .word, #slots .word')].find(e=>S.qWords[+e.dataset.wi]===w);
	  if(el){
	    el.classList.remove('glow');void el.offsetWidth;el.classList.add('glow');
	    setTimeout(()=>el.classList.remove('glow'),1800);
	  }
	  toast('💡 '+t('hintShow'));
	}
	function checkSort(){
	  if(S.lock)return;
	  if(S.placed.includes(null)){toast(t('fillAll'));return;}
	  const bad=[];
	  S.placed.forEach((wi,i)=>{if(S.qWords[wi]!==S.qAnswer[i])bad.push(i);});
	  if(!bad.length){
	    statRecord(true);
	    S.lock=true;stopTimer();S.score+=10;sCorrect();
	    document.querySelectorAll('#slots .slot').forEach(s=>s.classList.add('good'));
	    document.querySelectorAll('#slots .word').forEach(w=>w.classList.add('good'));
	    cheerBob();
	    popText('Great! +10 ⭐','good');
	    answerAssist();
	    updateHUD();
	  }else{
	    if(!S.failQ){S.failQ=true;S.wrongLevel++;markWrong();statRecord(false);}
	    S.failsThisQ++;
	    sWrong();
	    const slots=document.querySelectorAll('#slots .slot');
	    bad.forEach(i=>{
	      const w=slots[i]&&slots[i].querySelector('.word');
	      if(w){w.classList.remove('err');void w.offsetWidth;w.classList.add('err');}
	    });
	    shakeBob();updateHUD();
	    if(S.level===3&&S.wrongLevel>4&&!S.rescue){doRescue();return;}
	    if(S.level!==3&&S.failsThisQ>=3)hintFirst();  /* 答错3次自动提示首词 */
	    bobSay(t('tryAgain'));
	  }
	}
	function timeoutSort(){
	  if(S.lock)return;
	  S.lock=true;stopTimer();
	  if(!S.failQ){S.failQ=true;S.wrongLevel++;markWrong();statRecord(false);}
	  updateHUD();
	  if(S.level===3&&S.wrongLevel>4&&!S.rescue){doRescue();return;}
	  S.placed=S.qAnswer.map(w=>S.qWords.indexOf(w));
	  renderSortGame();
	  document.querySelectorAll('#slots .slot').forEach(s=>s.classList.add('good'));
	  document.querySelectorAll('#slots .word').forEach(w=>w.classList.add('good'));
	  popText(t('timeUp'),'warn');
	  bobSay(t('answerIs')+' '+S.qAnswer.join(' ')+S.punct);
	  setTimeout(nextQ,2300);
	}
	/* ═══════ 第二关：水母障碍 ═══════ */
	function qStartL2(){
	  const q=LEVEL2[S.qi];
	  S.qCorrect=q.o[0];
	  S.qOpts=shuffle(q.o);
	  S.qScram=shuffleWords(q.o[0].replace(/[.?]$/,'').split(' '));
	  S.qPunct=q.o[0].trim().endsWith('?')?'?':'.';
	  S.p1=null;S.p2=null;
	  renderL2();
	  startTimer(15,timeoutL2);
	  if(!S.pk)bobSay(t('bobTip2'));
	}
	function chipsHTML(){
	  return S.qScram.map(w=>`<span class="chip">${w}</span>`).join('')+
	         `<span class="chip punct-chip">${S.qPunct}</span>`;
	}
	function optsHTML(zone){
	  return S.qOpts.map((o,i)=>`<button class="opt" data-zone="${zone}" data-i="${i}">${o}</button>`).join('');
	}
	function renderL2(){
	  S.redraw=renderL2;
	  if(S.pk){
	    document.getElementById('screen').innerHTML=`
	      <div class="gwrap l2pk">
	        <div class="pk-top"><div class="chips">${chipsHTML()}</div></div>
	        <div class="pk-mid">
	          <div class="zone z1">
	            <div class="zhead">🔵 ${t('p1')} · <span class="zscore" id="zs1">${S.pScore[0]}</span></div>
	            <div class="zbody"><div class="optcol">${optsHTML(1)}</div><div class="bw sm">${bobHTML('')}</div></div>
	          </div>
	          <div class="pk-center">
	            <div class="jly" id="jly">${jellyHTML()}${jellyHTML()}${jellyHTML()}</div>
	            <div class="vs">VS</div>
	          </div>
	          <div class="zone z2">
	            <div class="zhead">🟠 ${t('p2')} · <span class="zscore" id="zs2">${S.pScore[1]}</span></div>
	            <div class="zbody"><div class="bw sm">${bobHTML('')}</div><div class="optcol">${optsHTML(2)}</div></div>
	          </div>
	        </div>
	      </div>`;
	  }else{
	    document.getElementById('screen').innerHTML=`
	      <div class="gwrap">
	        <div class="main">
	          <div class="prompt">${t('l2tip')}</div>
	          <div class="chips">${chipsHTML()}</div>
	          <div class="jly" id="jly">${jellyHTML()}${jellyHTML()}${jellyHTML()}</div>
	          <div class="optcol center">${optsHTML(0)}</div>
	        </div>
	        <div class="side"><div class="bubble" id="bob-bubble"></div>${bobHTML('')}</div>
	      </div>`;
	  }
	  document.querySelectorAll('.opt').forEach(b=>{
	    b.onclick=()=>judgeL2(+b.dataset.zone,+b.dataset.i);
	  });
	}
	function judgeL2(zone,i){
	  if(S.lock)return;
	  if(S.pk){
	    if(zone===1&&S.p1!=null)return;
	    if(zone===2&&S.p2!=null)return;
	  }
	  const ok=S.qOpts[i]===S.qCorrect;
	  if(ok){
	    statRecord(true);
	    S.lock=true;stopTimer();
	    const pts=S.doubleNext?2:1;S.doubleNext=false;
	    S.score+=pts;
	    if(zone)S.pScore[zone-1]+=pts;
	    const zs=document.getElementById('zs'+zone);
	    if(zs)zs.textContent=S.pScore[zone-1];
	    sCorrect();
	    document.querySelectorAll(`.opt[data-i="${i}"]`).forEach(b=>b.classList.add('good'));
	    const jb=zone?document.querySelector(`.zone.z${zone} .bob`):getBob();
	    if(jb)jb.classList.add(zone?'through':'cheer');
	    const jl=document.getElementById('jly');
	    if(jl)jl.classList.add('scatter');   /* 水母散开，海绵宝宝跳过去 */
	    S.streak++;
	    if(S.streak%3===0){S.doubleNext=true;popText(t('eagle'),'warm top2');}
	    popText('+'+pts,'good');
	    answerAssist();
	    updateHUD();
	  }else{
	    sZap();S.streak=0;
	    document.querySelectorAll(`.opt[data-i="${i}"]`).forEach(b=>b.classList.add('bad'));
	    const jb=zone?document.querySelector(`.zone.z${zone} .bob`):getBob();
	    if(jb){jb.classList.remove('zap');void jb.offsetWidth;jb.classList.add('zap');setTimeout(()=>jb.classList.remove('zap'),1000);}
	    if(!S.failQ){S.failQ=true;markWrong();statRecord(false);}
	    if(S.pk){
	      if(zone===1)S.p1=i;else S.p2=i;
	      const otherUsed=(zone===1)?(S.p2!=null):(S.p1!=null);
	      if(otherUsed)revealL2();
	      else toast('⚡ '+t('steal'));
	    }else bobSay(t('tryAgain'));
	    updateHUD();
	  }
	}
	function revealL2(){
	  S.lock=true;stopTimer();
	  const ci=S.qOpts.indexOf(S.qCorrect);
	  document.querySelectorAll(`.opt[data-i="${ci}"]`).forEach(b=>b.classList.add('good'));
	  popText(t('timeUp'),'warn');
	  updateHUD();
	  setTimeout(nextQ,2200);
	}
	function timeoutL2(){
	  if(S.lock)return;
	  S.lock=true;stopTimer();
	  if(!S.failQ)S.failQ=true;
	  const ci=S.qOpts.indexOf(S.qCorrect);
	  document.querySelectorAll(`.opt[data-i="${ci}"]`).forEach(b=>b.classList.add('good'));
	  popText(t('timeUp'),'warn');
	  toast('📣 '+t('shout'));
	  updateHUD();
	  setTimeout(nextQ,2300);
	}
	/* ═══════ 第三关：派大星终极关 ═══════ */
	function qStartL3(){
	  const spec=L3SEQ[S.qi];
	  if(spec.t==='s')qStartSort(45,true);   /* A型排序：无提示 */
	  else qStartFill(spec.d);               /* B型完形填空 */
	}
	function qStartFill(d){
	  S.fill=d;
	  renderFill();
	  startTimer(30,timeoutFill);
	  bobSay(t('bobTip3'));
	}
	function renderFill(){
	  S.redraw=renderFill;
	  const d=S.fill;
	  const chipsL=d.b.map(w=>`<span class="chip">${w}</span>`).join('');
	  const chipsR=d.a.map(w=>`<span class="chip">${w}</span>`).join('');
	  const opts=d.o.map((o,i)=>`<button class="opt fopt" data-i="${i}">${o===''?t('noWord'):o}</button>`).join('');
	  document.getElementById('screen').innerHTML=`
	    <div class="gwrap">
	      <div class="main">
	        <div class="prompt">${t('fillTip')}</div>
	        <div class="sentrow">${chipsL}<span class="bubbleb" id="bubble">❓</span>${chipsR}</div>
	        <div class="optrow">${opts}</div>
	        <div class="btnrow">${!S.lifeline?`<button class="btn btn-yellow btn-big" id="btn-pat" title="${t('rescueBtnHint')}">🌟 ${t('askPatrick')}</button>`:''}</div>
	      </div>
	      <div class="side"><div class="bubble" id="bob-bubble"></div>${bobHTML('')}</div>
	      ${patrickHTML('')}
	    </div>`;
	  document.querySelectorAll('.fopt').forEach(b=>{
	    b.onclick=()=>judgeFill(+b.dataset.i);
	  });
	  const pb=document.getElementById('btn-pat');
	  if(pb)pb.onclick=usePatrick;
	}
	function fillCorrect(){
	  const v=S.fill.o[S.fill.c];
	  const b=document.getElementById('bubble');
	  if(!b)return;
	  if(v==='')b.classList.add('gone');       /* "不填"：泡泡消失 */
	  else{b.textContent=v;b.classList.add('good');}
	}
	function markFopt(i,cls){
	  const b=document.querySelectorAll('.fopt')[i];
	  if(b)b.classList.add(cls);
	}
	function comboPop(st){
	  if(st===2){popText('Combo x2!','warm top2');sCombo(2);}
	  else if(st===3){popText('Perfect!','warm top2');sCombo(3);}
	  else if(st>=4){popText('Unbelievable!','warm top2');sCombo(4);}
	}
	function judgeFill(i){
	  if(S.lock)return;
	  if(i===S.fill.c){
	    statRecord(true);
	    S.lock=true;stopTimer();S.score+=10;sCorrect();
	    fillCorrect();
	    markFopt(i,'good');
	    S.streak++;
	    comboPop(S.streak);
	    popText('Great! +10 ⭐','good');
	    cheerBob();answerAssist();
	    updateHUD();
	  }else{
	    sZap();S.streak=0;
	    markFopt(i,'bad');
	    zapBob();
	    if(!S.failQ){S.failQ=true;S.wrongLevel++;markWrong();statRecord(false);}
	    updateHUD();
	    if(S.wrongLevel>4&&!S.rescue)doRescue();   /* 答错超过4题 → 派大星救援 */
	    else bobSay(t('tryAgain'));
	  }
	}
	function usePatrick(){  /* 完形填空求助：排除一个错误选项，仅1次 */
	  if(S.lifeline||S.lock)return;
	  S.lifeline=true;
	  const btns=document.querySelectorAll('.fopt');
	  const wrongs=S.fill.o.map((o,i)=>i).filter(i=>i!==S.fill.c&&!btns[i].classList.contains('bad'));
	  if(wrongs.length){
	    const pick=wrongs[Math.floor(Math.random()*wrongs.length)];
	    markFopt(pick,'dead');
	  }
	  showPatrick(t('patHint'));
	  const pb=document.getElementById('btn-pat');
	  if(pb)pb.remove();
	}
	function showPatrick(msg){
	  const p=document.getElementById('patrick');
	  if(!p)return;
	  p.classList.add('show');
	  const pb=p.querySelector('.p-bubble');
	  if(pb){pb.textContent=msg;pb.classList.add('popb');}
	}
	function doRescue(){  /* 派大星救援：帮答对当前这题 */
	  S.rescue=true;S.lock=true;stopTimer();
	  showPatrick(t('rescueMsg'));
	  if(L3SEQ[S.qi].t==='f'){
	    fillCorrect();
	    markFopt(S.fill.c,'good');
	    document.querySelectorAll('.fopt').forEach(b=>b.classList.add('dead'));
	  }else{
	    S.placed=S.qAnswer.map(w=>S.qWords.indexOf(w));
	    renderSortGame();
	    document.querySelectorAll('#slots .slot').forEach(s=>s.classList.add('good'));
	    document.querySelectorAll('#slots .word').forEach(w=>w.classList.add('good'));
	  }
	  popText(t('thanksP'),'warm top2');
	  sWin();updateHUD();
	  setTimeout(nextQ,2600);
	}
	function timeoutFill(){
	  if(S.lock)return;
	  S.lock=true;stopTimer();
	  if(!S.failQ){S.failQ=true;S.wrongLevel++;}
	  updateHUD();
	  if(S.wrongLevel>4&&!S.rescue){doRescue();return;}
	  fillCorrect();
	  document.querySelectorAll('.fopt').forEach((b,i)=>b.classList.add(i===S.fill.c?'good':'dead'));
	  popText(t('timeUp'),'warn');
	  setTimeout(nextQ,2200);
	}
	/* ═══════ 过关结算 / 全员通关 ═══════ */
	function levelComplete(){
	  stopTimer();S.lock=true;updateHUD();
	  let stars=1;
	  if(S.wrongLevel===0)stars=3;else if(S.wrongLevel<=2)stars=2;
	  if(stars>S.stars[S.level-1])S.stars[S.level-1]=stars;
	  save();sWin();S.lastStars=stars;
	  if(S.level===3){S.items.pass=true;updateHUD();showFinal(stars);return;}
	  if(S.level===1)S.items.map=true;
	  if(S.level===2)S.items.hat=true;
	  updateHUD();
	  showLevelDone(stars);
	}
	function showLevelDone(stars){
	  const lv=S.level;
	  S.reOv=()=>showLevelDone(stars);
	  const itemE={1:'🗺️',2:'🎩'}[lv];
	  let pkRes='';
	  if(lv===2&&S.pk){
	    if(S.pScore[0]===S.pScore[1])pkRes=`<div class="pkres">🤝 ${S.pScore[0]} : ${S.pScore[1]} ${t('draw')}</div>`;
	    else{
	      const w=S.pScore[0]>S.pScore[1]?t('p1'):t('p2');
	      pkRes=`<div class="pkres">👑 ${w} ${t('winner')}（${Math.max(S.pScore[0],S.pScore[1])} : ${Math.min(S.pScore[0],S.pScore[1])}）</div>`;
	    }
	  }
	  openOverlay(`
	    <div class="panel">
	      <div class="done-row">
	        <div class="chest" id="chest">
	          <div class="clid"></div><div class="cbase"></div><div class="lock"></div>
	          <div class="item">${itemE}</div>
	          <span class="cspark s1">✨</span><span class="cspark s2">✨</span>
	        </div>
	        <div class="bw">${bobHTML('cheer')}</div>
	      </div>
	      <h2>${t('lvClear')}</h2>
	      <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
	      ${pkRes}
	      <div class="reward">${t('reward')}<b>${t('item'+lv)}</b> ${itemE}</div>
	      <div class="row">
	        ${S.adventure?`<button class="btn btn-green btn-big" id="ov-next">${t('nextLv')}</button>`
	                     :`<button class="btn btn-yellow btn-big" id="ov-replay">${t('replay')}</button>`}
	        <button class="btn btn-blue btn-big" id="ov-map">${t('toMap')}</button>
	      </div>
	    </div>`);
	  setTimeout(()=>{const c=document.getElementById('chest');if(c)c.classList.add('open');},500);
	  confetti(50);
	  const nx=document.getElementById('ov-next');
	  if(nx)nx.onclick=()=>startLevel(lv+1,true);
	  const rp=document.getElementById('ov-replay');
	  if(rp)rp.onclick=()=>startLevel(lv,false);
	  document.getElementById('ov-map').onclick=showSelect;
	}
	function showFinal(stars){
	  S.reOv=()=>showFinal(stars);
	  openOverlay(`
	    <div class="panel">
	      <div class="dance-row">
	        <div class="bw">${bobHTML('dance')}</div>
	        ${patrickHTML('dancep')}
	      </div>
	      <h2>${t('allClear')}</h2>
	      <p class="story">${t('finalMsg')}</p>
	      <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
	      <div class="totals">${t('total')}: ⭐ ${S.score}</div>
	      <div class="row">
	        <button class="btn btn-yellow btn-big" id="ov-again">${t('replay')}</button>
	        <button class="btn btn-blue btn-big" id="ov-map">${t('toMap')}</button>
	      </div>
	    </div>`);
	  confetti(120);
	  setTimeout(()=>confetti(90),900);
	  setTimeout(()=>confetti(70),1900);
	  document.getElementById('ov-again').onclick=()=>startLevel(1,true);
	  document.getElementById('ov-map').onclick=showSelect;
	}
	/* ===== 初始化 ===== */
	function init(){
	  load();loadNB();
	  buildDeco();
	  const bl=document.getElementById('btn-lang');
	  bl.textContent=S.lang==='zh'?'EN':'中';
	  document.getElementById('btn-sound').textContent=S.sound?'🔊':'🔇';
	  document.getElementById('btn-home').onclick=()=>{sClick();if(S.level>0)showSelect();else showStart();};
	  const ph=document.getElementById('pine-home');if(ph)ph.onclick=()=>{sClick();openScope();};
	  document.getElementById('btn-lang').onclick=()=>{
	    S.lang=S.lang==='zh'?'en':'zh';
	    save();
	    bl.textContent=S.lang==='zh'?'EN':'中';
	    if(S.redraw)S.redraw();
	    if(S.reOv)S.reOv();
	  };
	  document.getElementById('btn-sound').onclick=function(){
	    S.sound=!S.sound;save();
	    this.textContent=S.sound?'🔊':'🔇';
	    if(S.sound)sClick();
	  };
	  loadAssist();syncAssist();
	  document.getElementById('btn-zh').onclick=()=>{S.showZh=!S.showZh;saveAssist();syncAssist();if(!S.showZh)hideMeaning();};
	  document.getElementById('btn-read').onclick=()=>{S.autoRead=!S.autoRead;saveAssist();syncAssist();if(!S.autoRead){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}};
	  /* 给所有按钮加统一的轻点击音（选择题按钮除外，它有自己的音效） */
	  document.addEventListener('click',e=>{
	    const b=e.target.closest('button');
	    if(b&&!b.classList.contains('opt'))sClick();
	  },true);
	  /* 首次触摸解锁音频 */
	  document.addEventListener('pointerdown',()=>{ac();},{once:true});
	  showStart();
	  updateHUD();
	}
	init();
	</script>
	</body>
	</html>
